<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantaray</title>
    <!--
      favicon（managed）
      - `scripts/generate-favicons.sh` が `favicons/<hash>` を内容ハッシュに置換します
      - `%BASE_URL%` は Vite が build 時に base（/ または ./）へ展開します
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicons/8dfacef16203/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicons/8dfacef16203/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicons/8dfacef16203/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%favicons/8dfacef16203/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%favicons/8dfacef16203/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
