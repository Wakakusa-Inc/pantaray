name: Release desktop (Electron) to GitHub Releases

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build_and_release:
    runs-on: macos-15
    # Signing/notarization secrets live in this environment.
    environment: release
    permissions:
      contents: write
    env:
      PNPM_FETCH_RETRIES: "5"
      PNPM_FETCH_RETRY_MAX_TIMEOUT_MS: "120000"
      PNPM_FETCH_TIMEOUT_MS: "600000"
      PNPM_RELEASE_CPU: arm64
      PNPM_RELEASE_OS: darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify release runner architecture
        run: |
          set -euo pipefail
          RUNNER_OS_NAME="$(uname -s)"
          RUNNER_ARCH_NAME="$(uname -m)"
          if [ "$RUNNER_OS_NAME" != "Darwin" ]; then
            echo "release-desktop runner must be Darwin: $RUNNER_OS_NAME" >&2
            exit 1
          fi
          if [ "$RUNNER_ARCH_NAME" != "arm64" ]; then
            echo "release-desktop runner must be arm64: $RUNNER_ARCH_NAME" >&2
            exit 1
          fi

      - name: Extract release version and update channel
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v1.8.2 -> 1.8.2（stable）、v1.8.2-test.1 -> 1.8.2-test.1（test チャネル）。
          # 配布版の updater が同じ規則でチャネルを決めるため、他の形式は受け付けない。
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$ ]]; then
            echo "invalid tag format: $TAG (expected vX.Y.Z or vX.Y.Z-test.N)" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-test.* ]]; then
            CHANNEL=test
          else
            CHANNEL=stable
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl --retry 3 --retry-all-errors -LsSf -o "$RUNNER_TEMP/uv-install.sh" https://astral.sh/uv/install.sh
          sh "$RUNNER_TEMP/uv-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.20.0"

      - name: Prepare pnpm install
        working-directory: frontend
        run: |
          set -euo pipefail
          PNPM_STORE_PATH="$HOME/Library/pnpm/store/v11"
          mkdir -p "$PNPM_STORE_PATH"
          echo "pnpm path: $(command -v pnpm)"
          echo "pnpm version: $(pnpm --version)"
          echo "pnpm store: $PNPM_STORE_PATH"
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$PNPM_STORE_PATH" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_NODE_LINKER=hoisted" >> "$GITHUB_ENV"
          rm -rf node_modules

      - name: Install dependencies
        working-directory: frontend
        timeout-minutes: 45
        # NOTE:
        # - 配布ビルド（electron-builder + asar）では pnpm の isolated node_modules だと依存取り込み漏れが起きやすい。
        # - release-desktop では hoisted linker を使い、npm に近い node_modules 構造で同梱を安定させる。
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile \
            --config.node-linker=hoisted \
            --config.fetch-retries="$PNPM_FETCH_RETRIES" \
            --config.fetch-timeout="$PNPM_FETCH_TIMEOUT_MS" \
            --config.fetch-retry-maxtimeout="$PNPM_FETCH_RETRY_MAX_TIMEOUT_MS" \
            --store-dir="$PNPM_STORE_PATH" \
            --cpu="$PNPM_RELEASE_CPU" \
            --os="$PNPM_RELEASE_OS" \
            --reporter=append-only

      - name: Icon policy (lucide-only)
        working-directory: frontend
        run: node scripts/check-icon-policy.js

      - name: Verify frontend/package.json version is fixed to 0.0.0 (tag is SSOT)
        working-directory: frontend
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "0.0.0" ]; then
            echo "frontend/package.json version must be fixed to 0.0.0 (tag is SSOT): package.json=$PKG_VERSION" >&2
            exit 1
          fi

      - name: Export required signing/notarization env
        # NOTE:
        # - release-desktop は配布物を作る経路なので Developer ID signing / notarization を必須にする。
        # - 未設定の secrets はここで fail-closed にし、ad-hoc signing へ落ちる余地を残さない。
        run: |
          set -euo pipefail
          umask 077

          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "$name is required for release desktop signing/notarization" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            {
              echo "$name<<EOF"
              printenv "$name"
              echo "EOF"
            } >> "$GITHUB_ENV"
          done
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Prepare Apple signing keychain (non-interactive)
        # NOTE:
        # - CI で codesign がキーチェーンアクセス待ちで停止するのを防ぐため、
        #   専用キーチェーンを作成して明示的にアクセス許可を付与する。
        # - CSC_LINK は base64 エンコード済みの .p12 を想定する。
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_LINK is required for release desktop signing" >&2
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "CSC_KEY_PASSWORD is required for release desktop signing" >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/pantaray-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/pantaray-signing-cert.p12"
          export CERT_PATH
          SYSTEM_KEYCHAIN="/Library/Keychains/System.keychain"
          SYSTEM_ROOTS_KEYCHAIN="/System/Library/Keychains/SystemRootCertificates.keychain"

          python - <<'PY'
          import base64, os
          cert_path = os.environ["CERT_PATH"]
          data = os.environ["CSC_LINK"].encode("utf-8")
          with open(cert_path, "wb") as f:
              f.write(base64.b64decode(data))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          # 一時キーチェーンが search list に入っていないと
          # `security find-identity` / electron-builder 側の探索で 0 valid になることがあるため、
          # 既存の search list を保持した上で一時キーチェーンを先頭に追加する（ジョブ末尾で復元）。
          # NOTE: macOS の /bin/bash は 3.2 系のため `mapfile` は使わない（bash3 互換にする）。
          security list-keychains -d user | sed -E 's/^[[:space:]]*"(.+)"$/\1/' > "$RUNNER_TEMP/orig_keychains.txt"
          set -- "$KEYCHAIN_PATH"
          while IFS= read -r kc; do
            [ -n "$kc" ] && set -- "$@" "$kc"
          done < "$RUNNER_TEMP/orig_keychains.txt"
          security list-keychains -d user -s "$@"

          # Developer ID の中間証明書が runner に入っていないと、
          # `security find-identity` が 0 valid を返すことがあるため、一時キーチェーンに同梱する。
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDCA.cer" -o "$RUNNER_TEMP/DeveloperIDCA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/security
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/DeveloperIDCA.cer"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "[debug] now_utc=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")"
          echo "[debug] certificates in build keychain (sha1 + summary)"
          security find-certificate -a -Z "$KEYCHAIN_PATH" || true

          # leaf を取り出して trust failure の理由を出す（有効性・用途・失効/OCSP 等）
          LEAF_PEM="$RUNNER_TEMP/leaf_developer_id_application.pem"
          security find-certificate -a -p -c "Developer ID Application" "$KEYCHAIN_PATH" > "$LEAF_PEM" || true
          if [ -s "$LEAF_PEM" ]; then
            echo "[debug] leaf cert (Developer ID Application) details"
            openssl x509 -in "$LEAF_PEM" -noout -subject -issuer -dates -ext keyUsage -ext extendedKeyUsage || true
            echo "[debug] verify leaf with codeSign policy (local-only)"
            security verify-cert -L -p codeSign -c "$LEAF_PEM" -k "$KEYCHAIN_PATH" -k "$SYSTEM_KEYCHAIN" -k "$SYSTEM_ROOTS_KEYCHAIN" || true
          else
            echo "[debug] leaf cert not found by common name search: \"Developer ID Application\""
          fi

          echo "[debug] identities (policy=codeSign)"
          security find-identity -p codesigning -v "$KEYCHAIN_PATH" "$SYSTEM_KEYCHAIN" "$SYSTEM_ROOTS_KEYCHAIN" || true
          echo "[debug] identities (policy=basic)"
          security find-identity -p basic -v "$KEYCHAIN_PATH" "$SYSTEM_KEYCHAIN" "$SYSTEM_ROOTS_KEYCHAIN" || true

          # NOTE: `security find-identity` の "valid" 判定は、チェーン検証のために
          # System/Root keychain を参照できる必要がある（参照できないと 0 になる）。
          security find-identity -p codesigning -v "$KEYCHAIN_PATH" "$SYSTEM_KEYCHAIN" "$SYSTEM_ROOTS_KEYCHAIN"

          rm -f "$CERT_PATH"

          # NOTE:
          # - electron-builder の `CSC_NAME` は "Developer ID Application:" の接頭辞付き文字列を嫌うため、
          #   ここでは確実に動く identity SHA-1 hash (40桁) を指定する。
          IDENTITY_SHA1="$(
            security find-certificate -Z -c "Developer ID Application" "$KEYCHAIN_PATH" \
              | awk -F': ' '/SHA-1 hash:/{print $2; exit}'
          )"
          if [ -z "$IDENTITY_SHA1" ]; then
            echo "failed to derive identity SHA-1 from build keychain" >&2
            security find-certificate -a -Z "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_NAME=$IDENTITY_SHA1" >> "$GITHUB_ENV"

          rm -f "$LEAF_PEM"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # NOTE: 署名/ノータライズは secrets 設定が必要（CSC_LINK/APPLE_ID 等）
      - name: Show electron-builder hooks
        working-directory: frontend
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkg = require('./package.json');
          const build = pkg.build || {};
          const afterSign = build.afterSign || null;
          const hookPath = afterSign ? path.resolve(afterSign) : null;
          const hookExists = hookPath ? fs.existsSync(hookPath) : false;
          console.log('[build-hook] afterSign:', afterSign);
          console.log('[build-hook] hookPath:', hookPath);
          console.log('[build-hook] hookExists:', hookExists);
          NODE

      - name: Build Electron app
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -z "${CSC_NAME:-}" ]; then
            echo "CSC_NAME is required before release desktop build" >&2
            exit 1
          fi
          if [ -z "${CSC_KEYCHAIN:-}" ]; then
            echo "CSC_KEYCHAIN is required before release desktop build" >&2
            exit 1
          fi
          if [ ! -f "$CSC_KEYCHAIN" ]; then
            echo "CSC_KEYCHAIN does not exist: $CSC_KEYCHAIN" >&2
            exit 1
          fi
          unset CSC_LINK CSC_KEY_PASSWORD
          rm -rf release
          (
            while true; do
              echo "[heartbeat] $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              ps -axo pid,ppid,comm | grep -E "codesign|notarytool|xcrun|app-builder|electron-builder" || true
              sleep 30
            done
          ) &
          WATCHER_PID="$!"
          trap 'kill "$WATCHER_PID" >/dev/null 2>&1 || true' EXIT
          pnpm run electron:build:signed
        env:
          DEBUG: electron-builder*,app-builder-lib*,electron-osx-sign*
          PANTARAY_RELEASE_BUILD: "1"
          # ---- Versioning (tag is SSOT) ----
          PANTARAY_DESKTOP_VERSION: ${{ steps.ver.outputs.version }}
          # 更新の取得先はこの workflow が Release を作る repo と同じにする。
          PANTARAY_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          PANTARAY_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Verify packaged python sandbox resources
        working-directory: frontend
        run: pnpm run verify:packaged-python-sandbox
        env:
          PANTARAY_PACKAGED_RESOURCES_PATH: ${{ github.workspace }}/frontend/release/mac-arm64/Pantaray.app/Contents/Resources

      - name: Cleanup build keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/pantaray-build.keychain-db"
          trap 'rm -f "$RUNNER_TEMP/pantaray-signing-cert.p12" "$RUNNER_TEMP/leaf_developer_id_application.pem" "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/DeveloperIDCA.cer" "$RUNNER_TEMP/orig_keychains.txt"' EXIT
          if [ -f "$RUNNER_TEMP/orig_keychains.txt" ]; then
            set --
            while IFS= read -r kc; do
              [ -n "$kc" ] && set -- "$@" "$kc"
            done < "$RUNNER_TEMP/orig_keychains.txt"
            if [ "$#" -gt 0 ]; then
              security list-keychains -d user -s "$@" || true
            fi
          fi
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || rm -f "$KEYCHAIN_PATH"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ steps.ver.outputs.version }}
          path: |
            frontend/release/**/*.dmg
            frontend/release/**/*.zip
            frontend/release/latest*.yml
            frontend/release/*.blockmap
          if-no-files-found: error
          overwrite: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # test チャネルは prerelease にして latest にしない。安定版の updater が
          # test リリースを選ばず、test リリースが安定版の latest を塞がないようにする。
          # 安定版は GitHub の既定に任せる（作成時に latest になり、再実行の edit では
          # latest を動かさない。古いリリースの再実行で最新版を降格させないため）。
          RELEASE_FLAGS=(--verify-tag)
          if [ "${CHANNEL}" = "test" ]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          shopt -s nullglob
          ASSETS=(
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/latest*.yml
            frontend/release/*.blockmap
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No desktop release artifacts found for GitHub Release" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_ASSET_NAMES="$(
              gh release view "$TAG" --json assets --jq '.assets[].name'
            )"
            MISSING_ASSETS=()
            for asset in "${ASSETS[@]}"; do
              asset_name="${asset##*/}"
              asset_exists=false
              while IFS= read -r existing_asset_name; do
                if [ "$existing_asset_name" = "$asset_name" ]; then
                  asset_exists=true
                  break
                fi
              done <<< "$EXISTING_ASSET_NAMES"
              if [ "$asset_exists" = false ]; then
                MISSING_ASSETS+=("$asset")
              fi
            done
            if [ "${#MISSING_ASSETS[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${MISSING_ASSETS[@]}"
            else
              echo "All GitHub Release assets already exist; skipping upload"
            fi
            gh release edit "$TAG" \
              --title "desktop v${VERSION}" \
              --notes "" \
              --draft=false \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "desktop v${VERSION}" \
              --notes "" \
              "${RELEASE_FLAGS[@]}"
          fi
