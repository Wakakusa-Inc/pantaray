name: CI (web)
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.20.0"

      # NOTE:
      # actions/setup-node の cache: pnpm は pnpm 実行ファイルが PATH にあることを前提にするため、
      # pnpm/action-setup の後で明示的に pnpm store をキャッシュする。
      - name: Get pnpm store directory
        working-directory: frontend
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Icon policy (lucide-only)
        working-directory: frontend
        run: node scripts/check-icon-policy.js

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Typecheck (renderer and tests)
        working-directory: frontend
        run: pnpm run typecheck

      - name: Test (web)
        working-directory: frontend
        run: pnpm run test:vitest

      - name: Test (renderer build policy)
        working-directory: frontend
        run: node --test ./tests/vite_renderer_build.test.js

      - name: Build (web)
        working-directory: frontend
        run: pnpm run build:web
