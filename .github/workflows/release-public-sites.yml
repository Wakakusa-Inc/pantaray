name: Release public sites (Firebase Hosting)

on:
  push:
    tags:
      - "site/v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # Production Firebase credentials are in the historically named environment.
    environment: develop
    permissions:
      contents: read
    steps:
      - name: Verify release tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^site/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be site/vX.Y.Z" >&2
            exit 1
          fi
          status="$(gh api "repos/$REPOSITORY/compare/$RELEASE_SHA...main" --jq '.status')"
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.26.2"

      - name: Check and build help
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Deploy landing
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: landing
          entryPoint: ./landing

      - name: Deploy help
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: help
          entryPoint: ./website
