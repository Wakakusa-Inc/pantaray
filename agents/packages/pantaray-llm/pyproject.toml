[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantaray-llm"
version = "0.1.0"
description = "Shared LLM and web-tool contracts, error contract, and inference purposes for Pantaray"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema==4.25.1",
    "openai==2.45.0",
    "pillow>=12.3.0",
    "pydantic>=2.10.5",
    "tavily-python==0.7.17",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pantaray_llm*"]

[tool.setuptools.package-data]
pantaray_llm = ["py.typed"]
